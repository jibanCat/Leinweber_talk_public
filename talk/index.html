<body>
<div id="stub" aria-live="polite"></div>
<div id="layers">
  <div class="layer" id="layer-fold">
    <canvas id="fold" aria-label="One simulated spectrum, joined by its neighbouring sightlines until they form a plane, which then gains depth and becomes a volume of hydrogen absorption."></canvas>
    <canvas id="cutband" aria-hidden="true"></canvas>
  </div>
  <div class="layer" id="layer-ghosts">
    <canvas id="ghosts" aria-label="A real simulated spectrum with a damped absorption trough, and model absorbers of growing column density; then thousands of faint candidate profiles, most of which go out."></canvas>
    <canvas id="galaxy" aria-hidden="true"></canvas>
    <p id="caption"></p>
  </div>
  <div class="layer" id="layer-texture">
    <canvas id="texture" aria-label="The forest along one sightline, made hotter and then given more ultraviolet light; then its texture, how much it wiggles at each size, for three settings of the gas, against a mock measurement with its uncertainty."></canvas>
  </div>
  <div class="layer" id="layer-survey">
    <canvas id="survey" aria-label="One slice of the sky from DESI's first data release: a fan of galaxies and quasars with the observer at its point, filling in, in the order DESI observed them, on the dark; the most distant quasars draw lines of hydrogen absorption towards us."></canvas>
    <div id="survey-labels" aria-hidden="true"></div>
  </div>
  <div class="layer" id="layer-chart">
    <canvas id="chart" aria-label="A chart of DESI's published results or of a fit computed from public data, on paper, with its sources in the foot."></canvas>
    <canvas id="chart-night" aria-hidden="true" style="visibility:hidden"></canvas>
  </div>
  <div class="layer" id="layer-expansion">
    <canvas id="expansion" aria-label="The size of the Universe against time since the Big Bang: it grows, slows, then speeds up as dark energy takes over; on the curve, DESI's ruler measured by each kind of galaxy and quasar, smallest and earliest by the Lyman-alpha forest, eleven billion years ago."></canvas>
  </div>
  <div class="layer" id="layer-gap">
    <canvas id="gap" aria-label="Above, how clumpy matter is at each size, as the standard model computes it, with DESI's and my measurements on it; below, one simulated sightline's gas and the light that crossed it, with pairs of points counted. When a galaxy's dense cloud appears in the gas and its trough in the light, the measurements rise above the model; once the cloud is found, masked and modelled, they come back."></canvas>
  </div>
  <div class="layer" id="layer-lyman">
    <canvas id="lyman" aria-label="A photon travels to a hydrogen atom and is absorbed: the electron jumps from the first level to the second. This is Lyman alpha, 121.6 nanometres. Then our simulation's hydrogen fills the slide; switched to its stars, only rare specks remain."></canvas>
  </div>
  <div class="layer" id="layer-map">
    <canvas id="map" aria-label="One spectrum, the light we followed, drawn as a line; then 480 of the simulation's spectra side by side make a map of the hydrogen's absorption; beside it, the same slice's gas: the two show the same cosmic web."></canvas>
  </div>
  <div class="layer" id="layer-count">
    <canvas id="count" aria-label="One slice of our simulation, 480 sightlines side by side, read from the top down; as each is read, its dense clouds light up and are counted: 134 Lyman-limit systems, 33 sub-DLAs and 10 DLAs, among them the galaxy the beam crossed."></canvas>
  </div>
  <div class="layer" id="layer-clip">
    <div id="clipband">
      <canvas id="gasview" aria-label="The simulation's gas around the light's path: first as quasar spectra see it, then where it really is, coloured by its temperature; a quasar's light crosses four of its sightlines, end to end."></canvas>
